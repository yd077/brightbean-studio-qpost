name: Build and Publish Docker Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yd077/brightbean-studio-qpost:latest
            ghcr.io/yd077/brightbean-studio-qpost:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/yd077/brightbean-studio-qpost
            org.opencontainers.image.description=BrightBean Studio with QPost API integration
